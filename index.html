<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantasy Football Union</title>
    <meta name="description" content="The Fantasy Football Union — 8+ seasons of a three-tier league with promotion and relegation. Standings, matchups, drafts, records, all-time stats, and roster-build analysis for the Premier, Masters, and National leagues." />
    <link rel="icon" type="image/png" href="/ffu-logo.png" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)" />
    <!-- Open Graph / Twitter — rich link previews in Discord, iMessage, social, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fantasy Football Union" />
    <meta property="og:title" content="Fantasy Football Union" />
    <meta property="og:description" content="8+ seasons of league history — standings, drafts, records, all-time stats, and roster-build analysis." />
    <meta property="og:image" content="https://ffunion.com/ffu-logo.png" />
    <meta property="og:url" content="https://ffunion.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fantasy Football Union" />
    <meta name="twitter:description" content="8+ seasons of league history — standings, drafts, records, all-time stats, and roster-build analysis." />
    <meta name="twitter:image" content="https://ffunion.com/ffu-logo.png" />
    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      try {
        const t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) { /* ignore */ }
    </script>
    <!-- SPA redirect decoder: restores the real path after public/404.html bounces
         a deep link through "/?/...". https://github.com/rafgraph/spa-github-pages -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
