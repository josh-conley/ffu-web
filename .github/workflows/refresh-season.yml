name: Refresh live season

# Writes the season being played into public/data every Tuesday, so Standings, Matchups, Stats and
# every other page see the week that just finished. Replaces the claude.ai cloud routine that did
# this until 2026-09-17: the job is fixed steps, a failure should be a red ✗ + email rather than a
# "successful" session, and GitHub's runners can reach api.sleeper.app without an allowlist.
#
# Flow: refresh from Sleeper → drafts + lineups → check-season-refresh (fails on changed completed
# scores or stray files) → commit to bot/data-refresh → open a PR → wait for CI's `verify` on it →
# merge. The merge is a normal push to main, so deploy.yml starts on its own.
#
# Why DATA_REFRESH_TOKEN and not the built-in workflow token: main's ruleset requires `verify`, and
# events made with the workflow token start no other workflows, so its PR never got a `verify` run
# (2026-09-29 to 2026-10-05, merged by hand each Tuesday). The secret is a fine-grained token scoped
# to this repo (Contents + Pull requests, read/write), so its PR runs CI like anyone's. It belongs to
# Josh, who can bypass the ruleset, so THIS FILE is what holds the line: it merges only after
# `verify` passes. It is used here only; never hand it to discord-requests.yml's agent.
#
# Schedule: Tuesdays 9:05am and 1:05pm Eastern, September–December. Cron is UTC only, so the
# months split by daylight saving: EDT (UTC-4) through October, EST (UTC-5) from November. In a
# year whose clocks change after the first Tuesday of November (first Sunday is the 3rd or later)
# that one Tuesday runs an hour late. The afternoon run is a safety net: GitHub's scheduled runs are
# best-effort and have been dropped or hours late (none on 2026-10-13 by 10:40am ET), and it's a
# no-op when the morning run already committed. The months stop at December because the script
# defaults to the calendar year and refuses any year that isn't live — a January run would fail —
# and the regular season (all this writes) is over by mid-December anyway. Minute 5, not :00:
# GitHub sheds scheduled runs at the top of the hour under load.
on:
  schedule:
    - cron: '5 13,17 * 9-10 2'
    - cron: '5 14,18 * 11-12 2'
  workflow_dispatch: {}

# The built-in token only reads; every write goes through DATA_REFRESH_TOKEN (see above).
permissions:
  contents: read

concurrency:
  group: refresh-season
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check the token is set
        env:
          TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::DATA_REFRESH_TOKEN is not set (Settings → Secrets and variables → Actions). See ai-docs/TODO.md."
            exit 1
          fi

      # Checked out WITH the token so the branch push below is made as its owner, not the workflow.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.DATA_REFRESH_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run refresh-season

      - run: npm run backfill-drafts

      # Box scores for the week just written. Without this the Matchups modal says "Lineups aren't
      # available for this game" all season: the refresh writes games, never lineups. Narrowed to
      # the live year so completed seasons are never rewritten; it merges any new players into
      # players.json and sets `hasLineups` for the tier-seasons it wrote.
      - run: npm run backfill-lineups "$(date +%Y)"

      - id: check
        run: node scripts/check-season-refresh.mjs

      # No gates run here: CI's `verify` (lint, typecheck, test, build) runs on the exact commit below,
      # and main only moves if it passes. Some tests read the real data files, so this is also what
      # proves the refreshed data, not just the committed data, is green.
      - name: Commit to the bot branch
        id: commit
        if: steps.check.outputs.changed == 'true'
        env:
          MESSAGE: ${{ steps.check.outputs.message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          git commit -m "$MESSAGE"
          # Someone may have pushed while this ran; the commit only touches public/data, so rebasing
          # onto it is safe.
          git pull --rebase origin main
          # The branch belongs to this workflow alone and is rebuilt each run, so forcing it is safe.
          git push --force origin HEAD:refs/heads/bot/data-refresh
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open the PR and wait for verify
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
          MESSAGE: ${{ steps.check.outputs.message }}
        run: |
          # Reuse the PR a failed earlier run left open, if any; the branch is always this run's commit.
          if ! gh pr view bot/data-refresh --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            gh pr create --base main --head bot/data-refresh --title "$(head -1 <<< "$MESSAGE")" \
              --body "Weekly data refresh, opened by refresh-season.yml and merged once \`verify\` passes."
          fi
          # CI is the only workflow that runs on a PR, so its `verify` is the one check to wait on. It
          # takes a few seconds to register; until it does, `gh pr checks` reports none.
          for _ in $(seq 30); do
            gh pr checks bot/data-refresh >/dev/null 2>&1 && break
            [ "$?" -eq 8 ] && break # 8 = the check exists and is still pending
            sleep 5
          done
          gh pr checks bot/data-refresh --watch --fail-fast --interval 15

      # Only after verify is green. If main moved during CI the merge is refused as out of date
      # rather than published unverified; rerun the workflow.
      - name: Merge to main
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
        run: gh pr merge bot/data-refresh --merge --delete-branch
