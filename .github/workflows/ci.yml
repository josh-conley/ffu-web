name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by refresh-season.yml on its bot/data-refresh commit: a workflow-token push fires no
  # push event, and main's ruleset needs `verify` green on a commit before main can move to it.
  workflow_dispatch:

# Charter §10: nothing merges red — lint + typecheck + tests + build all gate.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
