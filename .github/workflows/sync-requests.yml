name: Sync requests branch with main

# Keeps the rolling auto/requests branch (and so preview.ffunion.com) caught up with main, so it never
# drifts behind production. Runs after every production deploy: fast-forwards the branch to main when
# nothing is pending on it, or merges main into it when something is (the pending requests stay on
# top). A conflict is left for a person or a session to resolve, and fails this run so it's visible.
#
# Triggered by the deploy finishing rather than by `push: main`: the weekly data refresh pushes with
# the workflow token, which fires no push events, and then starts the deploy itself. Every change to
# main ends in a deploy, so this sees all of them.

on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write # update auto/requests

# Shares preview-deploy.yml's group, so a sync and a session's push never deploy over each other.
concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Bring auto/requests up to main
        id: sync
        run: |
          git config user.name "ffu-bot"
          git config user.email "ffu-bot@users.noreply.github.com"
          if ! git rev-parse --verify --quiet origin/auto/requests >/dev/null; then
            git push origin origin/main:refs/heads/auto/requests
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor origin/main origin/auto/requests; then
            echo "auto/requests already contains main."
            exit 0
          fi
          if git merge-base --is-ancestor origin/auto/requests origin/main; then
            echo "Nothing pending: fast-forwarding auto/requests to main."
            git checkout -B auto/requests origin/main
          else
            echo "Requests pending: merging main into auto/requests."
            git checkout -B auto/requests origin/auto/requests
            if ! git merge --no-edit origin/main; then
              git merge --abort
              echo "::error::main conflicts with the pending requests on auto/requests. Merge main into it by hand."
              exit 1
            fi
          fi
          # Never forced: if someone pushed to the branch meanwhile, this fails and the next deploy retries.
          git push origin HEAD:refs/heads/auto/requests
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The workflow token's push above doesn't trigger preview-deploy.yml, so deploy here.
      # continue-on-error: a preview hiccup must never fail the sync itself.
      - uses: actions/setup-node@v5
        if: steps.sync.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Redeploy preview
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run build
          npx wrangler@4 pages deploy dist --project-name ffu-web-preview --branch auto/requests --commit-dirty=true
